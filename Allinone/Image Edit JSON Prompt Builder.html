<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image Edit JSON Prompt Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{--bg:#e9eef1;--sf:#fff;--ink:#14202b;--mut:#5b6b78;--ln:#cfd8de;--ac:#0e6b6b;--act:#fff;--code:#0f1d24;--cinK:#c9f0e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151a;--sf:#16222a;--ink:#e6eef2;--mut:#8fa2ae;--ln:#2a3b46;--ac:#4fd1b5;--act:#06201a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d151a;--sf:#16222a;--ink:#e6eef2;--mut:#8fa2ae;--ln:#2a3b46;--ac:#4fd1b5;--act:#06201a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ln);background:var(--sf);flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600}
header p{margin:0;color:var(--mut);font-size:13px}
main{display:grid;gap:16px;padding:16px;max-width:1280px;margin:auto;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.sticky{position:sticky;top:12px;align-self:start}}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:64px}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:8px 14px}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.sm{padding:3px 9px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.desc{background:var(--bg);border-left:3px solid var(--ac);padding:10px 12px;margin:10px 0;border-radius:0 6px 6px 0;font-size:14px}
.pv{position:relative;display:inline-block;max-width:100%;margin-top:8px;touch-action:none;cursor:crosshair}
.pv img{max-width:100%;max-height:260px;display:block;border-radius:6px}
.pv i{position:absolute;border:2px solid var(--ac);background:#4fd1b533;pointer-events:none}
ul{list-style:none;margin:0;padding:0}
li.e{border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;font-size:14px}
li.e small{display:block;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px;color:var(--ink)}
.chk input{width:auto}
pre{background:var(--code);color:var(--cinK);font:12.5px/1.5 "IBM Plex Mono",ui-monospace,monospace;padding:14px;border-radius:8px;overflow:auto;max-height:60vh;margin:0;white-space:pre-wrap;word-break:break-word}
#st{min-height:20px;color:var(--ac);font-size:13px;margin-top:6px}
</style>
</head>

 <div><h1 data-i="title"></h1><p data-i="sub"></p></div>

</header>

  </div>

  <textarea id="subj"></textarea>
  <label data-i="up"></label>
  <input type="file" id="file" accept="image/*">
  <div id="pvw"></div>
  <p class="mut" data-i="uph"></p>

  </div>
  <div class="desc" id="desc"></div>
  <div id="fields"></div>
  <div class="bar">

  </div>
  <div id="st" role="status"></div>

  <h2 data-i="s3"></h2>
  <ul id="list"></ul>
  <h2 style="margin-top:14px" data-i="keep"></h2>
  <div id="keeps"></div>
  <label data-i="neg"></label>
  <input id="neg">
 </section>
</div>
<div class="sticky">
 <section>
  <h2 data-i="s4"></h2>
  <div class="bar" style="margin-top:0">

 </section>
 <section>
  <h2 data-i="s5"></h2>
  <div class="row"><input id="sname"><button id="save" type="button" data-i="save"></button></div>
  <ul id="lib" style="margin-top:10px"></ul>
 </section>
</div>
</main>

const sv=a=>{try{localStorage.setItem("iep_lib",JSON.stringify(a))}catch(e){}};
const say=k=>{$("#st").textContent=S[k][lang];setTimeout(()=>$("#st").textContent="",1800)};
function fillSel(el,arr,i){el.innerHTML=arr.map((x,n)=>`<option value="${n}">${esc(x)}</option>`).join("");el.value=i}
function ui(){
 document.documentElement.lang=lang?"en":"th";$("#lg").textContent=lang?"ไทย":"EN";
 $$("[data-i]").forEach(e=>e.textContent=S[e.dataset.i][lang]);
 $("#sname").placeholder=S.sph[lang];
 fillSel($("#mode"),MODES.map(m=>m[1][lang]),$("#mode").value||0);
 fillSel($("#cat"),C.map(c=>c[1][lang]),sel[0]);
 form();list();keeps();lib();gen()}
function form(){
 const it=C[sel[0]][2][sel[1]];
 fillSel($("#op"),C[sel[0]][2].map(i=>i[1][lang]),sel[1]);
 $("#desc").textContent=it[2][lang];
 $("#fields").innerHTML=it[3].split(",").map(k=>`<label>${esc(F[k][lang])}</label><input data-f="${k}" ${k=="level"?'type="number" min="0" max="100"':""} placeholder="${esc(F[k][2+lang])}">`).join("")}
function keeps(){
 const on=$$("#keeps input:checked").map(i=>i.value);
 $("#keeps").innerHTML=K.map(k=>`<label class="chk"><input type="checkbox" value="${k[0]}" ${on.includes(k[0])||!on.length&&!$("#keeps").dataset.s?"checked":""}>${esc(k[1][lang])}</label>`).join("");$("#keeps").dataset.s=1}
function list(){
 $("#list").innerHTML=edits.length?edits.map((e,n)=>{const it=C[e.c][2][e.i];return `<li class="e"><span><b>${n+1}. ${esc(it[1][lang])}</b><small>${esc(Object.entries(e.v).map(([k,v])=>F[k][lang]+": "+v).join(" | "))}</small></span><span><button class="sm" data-a="ed" data-n="${n}" type="button">${S.edit[lang]}</button> <button class="sm" data-a="rm" data-n="${n}" type="button">${S.rm[lang]}</button></span></li>`}).join(""):`<li class="mut">${S.empty[lang]}</li>`}
function state(){return{mode:$("#mode").value,target:$("#tg").value,subject:$("#subj").value,edits,keep:$$("#keeps input:checked").map(i=>i.value),neg:$("#neg").value,img:img&&{name:img.name,w:img.w,h:img.h}}}
function build(){
 const s=state(),L=lang,e=s.edits.map((x,n)=>{const it=C[x.c][2][x.i];return{step:n+1,category:C[x.c][0],operation:it[0],parameters:x.v,instruction:it[1][1]+": "+Object.entries(x.v).map(([k,v])=>k+"="+v).join("; ")}});
 const keep=K.filter(k=>s.keep.includes(k[0])).map(k=>k[1][L]),neg=s.neg.split(",").map(x=>x.trim()).filter(Boolean);
 const fp=(L?"Edit the image":"แก้ไขภาพ")+(s.subject?` “${s.subject}”`:"")+": "+e.map(x=>x.instruction).join(". ")+". "+(keep.length?(L?"Keep unchanged: ":"คงเดิม: ")+keep.join("; ")+". ":"")+(neg.length?(L?"Avoid: ":"ห้าม: ")+neg.join(", ")+".":"");
 return{schema:"image_edit_v1",target:s.target,language:L?"en":"th",task:MODES[s.mode][0],subject:s.subject,source_image:s.img?{filename:s.img.name,width:s.img.w,height:s.img.h,coordinate_system:"percent_of_image"}:null,edits:e,preserve:keep,negative:neg,rules:RULES.map(r=>r[L]).concat(s.target=="Google Flow"?[L?"Use as an image-to-image edit prompt; run one step at a time if results drift.":"ใช้เป็น prompt แก้ภาพ (image-to-image) หากผลเพี้ยนให้ทำทีละ step"]:[L?"Attach the source image and apply this JSON as the edit instruction.":"แนบภาพต้นฉบับ แล้วใช้ JSON นี้เป็นคำสั่งแก้ภาพ"]),final_prompt:fp}}
function gen(){$("#out").textContent=JSON.stringify(build(),null,2)}
function lib(){const a=ld();$("#lib").innerHTML=a.length?a.map((x,n)=>`<li class="e"><span><b>${esc(x.name)}</b><small>${esc(x.s.edits.length)} edits</small></span><span><button class="sm" data-a="ld" data-n="${n}" type="button">${S.load[lang]}</button> <button class="sm" data-a="dl" data-n="${n}" type="button">${S.del[lang]}</button></span></li>`).join(""):`<li class="mut">${S.nolib[lang]}</li>`}
$("#lg").onclick=()=>{lang=1-lang;ui()};
$("#cat").onchange=e=>{sel=[+e.target.value,0];form()};
$("#op").onchange=e=>{sel[1]=+e.target.value;form()};
$("#fill").onclick=()=>$$("#fields input").forEach(i=>i.value=i.placeholder.replace(/ \((ลาก|drag).*\)$/,""));
$("#add").onclick=()=>{const v={};$$("#fields input").forEach(i=>{if(i.value.trim())v[i.dataset.f]=i.value.trim()});if(!Object.keys(v).length)return say("need");edits.push({c:sel[0],i:sel[1],v});$$("#fields input").forEach(i=>i.value="");list();gen();say("added")};
$("#list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.n,x=edits[n];if(b.dataset.a=="ed"){sel=[x.c,x.i];$("#cat").value=x.c;form();$$("#fields input").forEach(i=>i.value=x.v[i.dataset.f]||"")}edits.splice(n,1);list();gen()};
$("#gen").onclick=gen;
$("#cp").onclick=()=>{gen();const t=$("#out").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const r=document.createRange();r.selectNodeContents($("#out"));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy")});say("copied")};
$("#save").onclick=()=>{const a=ld(),n=$("#sname").value.trim()||(state().subject||"Prompt")+" "+(a.length+1);a.unshift({name:n,s:state()});sv(a);lib();say("saved")};
$("#lib").onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=ld(),n=+b.dataset.n;if(b.dataset.a=="dl"){a.splice(n,1);sv(a);return lib()}const s=a[n].s;edits=s.edits;$("#mode").value=s.mode;$("#tg").value=s.target;$("#subj").value=s.subject;$("#neg").value=s.neg;$("#keeps").innerHTML="";$("#keeps").dataset.s=1;keeps();$$("#keeps input").forEach(i=>i.checked=s.keep.includes(i.value));list();gen()};
["#mode","#tg","#subj","#neg"].forEach(s=>$(s).addEventListener("input",gen));
$("#keeps").addEventListener("change",gen);
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{img={name:f.name,w:im.naturalWidth,h:im.naturalHeight};$("#pvw").innerHTML='<div class="pv" id="pv"><img src="'+r.result+'" alt=""></div>';drag();gen()};im.src=r.result};r.readAsDataURL(f)};
function drag(){const pv=$("#pv");let a=null,box=null;
 const pt=e=>{const r=pv.getBoundingClientRect();return[Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100)),Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100))]};
 pv.onpointerdown=e=>{a=pt(e);pv.setPointerCapture(e.pointerId);box&&box.remove();box=document.createElement("i");pv.appendChild(box)};
 pv.onpointermove=e=>{if(!a)return;const p=pt(e),x=Math.min(a[0],p[0]),y=Math.min(a[1],p[1]);Object.assign(box.style,{left:x+"%",top:y+"%",width:Math.abs(p[0]-a[0])+"%",height:Math.abs(p[1]-a[1])+"%"})};
 pv.onpointerup=e=>{if(!a)return;const p=pt(e),x=Math.min(a[0],p[0]),y=Math.min(a[1],p[1]),w=Math.abs(p[0]-a[0]),h=Math.abs(p[1]-a[1]);a=null;const f=$('#fields [data-f="region"]');if(f&&w>1&&h>1)f.value=`x=${x.toFixed(0)}%,y=${y.toFixed(0)}%,w=${w.toFixed(0)}%,h=${h.toFixed(0)}%`}}
ui();
</script>
</body>
</html>
