<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เมนูหลัก</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      background-size: 300% 300%;
      animation: bgMove 12s ease infinite;
    }

    @keyframes bgMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: clamp(24px, 5vw, 40px);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #fff;
      font-weight: 600;
      font-size: clamp(1.5rem, 5vw, 2rem);
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: clamp(0.9rem, 3vw, 1rem);
      margin-bottom: 28px;
    }

    /* ตัวนับเลขอัตโนมัติ */
    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
      counter-reset: item;
    }

    .menu a {
      counter-increment: item;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      color: #333;
      text-decoration: none;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .menu a::before {
      content: counter(item);
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-weight: 600;
    }

    .menu a::after {
      content: "›";
      margin-left: auto;
      font-size: 1.6rem;
      color: #999;
      transition: transform 0.2s ease;
    }

    .menu a:hover,
    .menu a:focus-visible {
      background: #fff;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      outline: none;
    }

    .menu a:hover::after {
      transform: translateX(5px);
      color: #764ba2;
    }

    .menu a:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>เมนูหลัก</h1>
    <p class="subtitle">เลือกรายการที่ต้องการ</p>

    <nav class="menu">

      <!-- ========================================
           วิธีแก้ไข:
           - เปลี่ยนลิงก์ที่ href="..."
           - เปลี่ยนข้อความระหว่าง > และ </a>
           - เพิ่มข้อใหม่: ก๊อปบรรทัด <a ...>...</a> ไปวางต่อท้าย
           - เลขข้อรันให้อัตโนมัติ
           - ถ้าอยากให้เปิดแท็บใหม่ ให้เพิ่ม target="_blank"
           ======================================== -->

      <a href="dynamic_sticker_json_prompt_builder.html">Dynamic Sticker JSON Prompt Builder</a>
      <a href="https://www.youtube.com">xxxxxxxxxxxxxxxxxxxxxx</a>
      <a href="https://www.facebook.com" target="_blank">xxxxxxxxxxxxxxxxxxxxxx</a>
	   <a href="https://www.facebook.com" target="_blank">xxxxxxxxxxxxxxxxxxxxxx</a>
	    <a href="https://www.facebook.com" target="_blank">xxxxxxxxxxxxxxxxxxxxxx</a>
		 <a href="https://www.facebook.com" target="_blank">xxxxxxxxxxxxxxxxxxxxxx</a>

      <!-- เพิ่มข้อใหม่ต่อจากตรงนี้ -->

    </nav>
  </div>

</body>
</html>
